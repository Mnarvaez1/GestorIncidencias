name: CI .NET Framework 4.7.2

on:
  push:
    branches:
      - master
      - feat/gestion-incidencias
  pull_request:
    branches:
      - master
      - feat/gestion-incidencias

jobs:
  build-and-test:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages (MSTest)
        run: nuget restore GestorIncidencias.Tests\packages.config -PackagesDirectory packages

      - name: Build GestorIncidencias (Release)
        run: msbuild GestorIncidencias\GestorIncidencias.csproj /p:Configuration=Release /p:Platform=AnyCPU /m

      - name: Build GestorIncidencias.Tests (Release)
        run: msbuild GestorIncidencias.Tests\GestorIncidencias.Tests.csproj /p:Configuration=Release /p:Platform=AnyCPU /m

      - name: Run MSTest
        shell: powershell
        run: |
          & "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\Extensions\TestPlatform\vstest.console.exe" `
            ".\GestorIncidencias.Tests\bin\Release\GestorIncidencias.Tests.dll" `
            "/TestAdapterPath:.\packages\MSTest.TestAdapter.4.5.1\build\_common" `
            "/Logger:trx"
